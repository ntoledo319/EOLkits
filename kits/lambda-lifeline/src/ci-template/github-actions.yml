# .github/workflows/lambda-lifeline.yml
# Pin the major Action tag to gate pull requests on source-level Node 24 readiness.
name: lambda-lifeline

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'infra/**'
      - 'template.yaml'
      - '*.tf'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ntoledo319/EOLkits@v2
        with:
          kit: lambda-lifeline
          path: .
          fail-on: any
          comment-pr: false

      # Live AWS account inventory is deliberately separate from the source
      # gate. Add it only in a reviewed workflow with a dedicated read-only role.
