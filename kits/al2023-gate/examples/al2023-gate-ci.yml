# Generated by al2023-gate ci-template. Runs offline; requires the kit at the configured repository path.
# State can contain secrets: use a sanitized inventory export or a protected runner-produced file, never upload raw state.
name: AL2023 migration gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  al2023:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the vendored scanner
        run: python -m pip install './kits/al2023-gate'
      - name: Check state evidence without AWS credentials
        run: al2023-gate terraform-state './kits/al2023-gate/examples/terraform.tfstate' --ami-catalog 'kits/al2023-gate/examples/ami-catalog.json' --region 'us-east-1' --strict
