name: Python Lambda compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Vendor this reviewed kit into the application repository at TOOLKIT_PATH.
      # Set these paths to the real application files before enabling the job.
      TOOLKIT_PATH: kits/python-pivot
      SOURCE_PATH: src
      DEPENDENCY_FILE: requirements.txt
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the reviewed local toolkit
        run: python -m pip install "$TOOLKIT_PATH"
      - name: Preview source compatibility changes
        run: python-pivot --no-banner codemod "$SOURCE_PATH" --strict
      - name: Check dependency declarations
        run: python-pivot --no-banner audit "$DEPENDENCY_FILE" --format json --strict
