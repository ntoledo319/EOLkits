[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-pivot"
version = "1.0.0"
description = "AWS Lambda Python runtime checks, compatibility rules, dependency audits, IaC previews, and guarded deploy/rollback commands."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EOLkits" }]
keywords = ["aws", "lambda", "python", "migration", "eol", "3.12", "boto3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.28.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.1.0"]

[project.scripts]
python-pivot = "python_pivot.cli:main"

[project.urls]
Homepage = "https://eolkits.com"
Repository = "https://github.com/ntoledo319/EOLkits"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mutmut]
paths_to_mutate = "src/python_pivot/"
tests_dir = "test/"
runner = "python -m pytest -x -q --no-header"
