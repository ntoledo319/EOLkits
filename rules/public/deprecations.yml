# - The public ICS calendar feed
# - SEO /migrate/<deprecation> page generation
# - Deadline calculations and migration guidance

deprecations:
  - name: "Lambda Node.js 20 create/update restrictions"
    slug: "lambda-node.js-20-phase-1"
    service: "AWS Lambda"
    resource_type: "function"
    date: "2027-07-29"
    block_update_date: "2027-08-31"
    deprecation_date: "2026-04-30"
    description: "Node.js 20 Lambda runtime (Amazon Linux 2023) was deprecated on 2026-04-30 (no further security patches). Per the AWS Lambda runtime deprecation table, AWS blocks creating new nodejs20.x functions on 2027-07-29 and updating existing ones on 2027-08-31."
    severity: high
    kit: lambda-lifeline
    url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html"
    tags: [lambda, nodejs, runtime]
    breaking_changes:
      - "CreateFunction and UpdateFunctionConfiguration API calls fail after the published block dates"
      - "aws-sdk v2 not bundled (use @aws-sdk/* v3 modular clients)"
      - "Node.js 22/24 removes crypto.createCipher and deprecates built-in punycode"
      - "Native N-API addons must be verified against Node.js 22/24 ABI"

