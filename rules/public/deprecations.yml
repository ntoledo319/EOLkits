    description: "Node.js 20 Lambda runtime (Amazon Linux 2023) deprecated 2026-04-30. Per the AWS Lambda runtime deprecation table, AWS blocks creating new nodejs20.x functions on 2027-02-01 and updating existing ones on 2027-03-03 — part of the synchronized Q1-2027 runtime-block cluster."
    severity: high
    kit: lambda-lifeline
    url: "https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html"
    tags: [lambda, nodejs, runtime]
    breaking_changes:
      - "CreateFunction and UpdateFunctionConfiguration API calls fail"
