    description: "Amazon Linux 2 reached end of life on 2026-06-30 and should be migrated to Amazon Linux 2023. AWS has published post-EOL AL2 releases, so EOLkits does not equate the date with proof that a specific instance has received no later update; verify the installed release and current AWS support terms."
    severity: critical
    kit: al2023-gate
    url: "https://aws.amazon.com/blogs/aws/update-on-amazon-linux-2-end-of-life/"
