version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/kits/al2023-gate"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/kits/python-pivot"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/kits/lambda-lifeline"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/apps/worker"
    schedule:
      interval: "weekly"
    ignore:
      # Keep Node 20 API types; newer build tooling does not require Node 26 APIs.
      - dependency-name: "@types/node"
        versions: [">=21.0.0"]
  - package-ecosystem: "npm"
    directory: "/apps/vscode-extension"
    schedule:
      interval: "weekly"
    ignore:
      # VS Code 1.85 remains supported; newer API types break vsce packaging.
      - dependency-name: "@types/vscode"
        versions: [">=1.86.0"]
      # typescript-eslint 8.69 requires TypeScript <6.1; retain compatible fixes.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/grace-api"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/apps/runner"
    schedule:
      interval: "weekly"
