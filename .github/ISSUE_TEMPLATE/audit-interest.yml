name: "$299 Audit interest"
description: "Record public, no-obligation interest after a real EOLkits finding"
title: "[Audit interest] one repository evidence report"
body:
  - type: markdown
    attributes:
      value: |
        This form records qualified demand for the one-time $299 repository evidence report while checkout is closed.

        **This is public, nonbinding product research—not an order, reservation, waitlist, support request, or promise of follow-up.** GitHub publishes your username and submission. Do not include repository names, filenames, code, secrets, security details, company information, email addresses, or other personal data.

  - type: dropdown
    id: source
    attributes:
      label: Where did you encounter the finding?
      options:
        - Browser scanner
        - GitHub Action
        - VS Code extension
        - Migration or fix guide
        - Local EOLkits CLI
        - Other public EOLkits page
    validations:
      required: true

  - type: dropdown
    id: purchase_window
    attributes:
      label: If the report fits, when could you realistically purchase it?
      options:
        - Within 30 days
        - Within 31–90 days
        - Researching only
    validations:
      required: true

  - type: checkboxes
    id: qualification
    attributes:
      label: Required confirmations
      options:
        - label: I ran an EOLkits scanner on real project files and it produced at least one relevant finding.
          required: true
        - label: I understand the offer is one static repository evidence report priced at $299.
          required: true
        - label: If checkout were open and the documented scope fit, I would consider purchasing it.
          required: true
        - label: I will not include repository names, filenames, code, secrets, security details, company information, email addresses, or other personal data anywhere in this public issue.
          required: true
