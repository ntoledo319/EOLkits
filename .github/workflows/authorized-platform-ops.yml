name: Authorized one-use platform operations

on:
  # Valid only for the first main update after the verified v1.2 release.
  # Remove this workflow after its single terminal run.
  push:
    branches: [main]
    paths:
      - '.github/workflows/authorized-platform-ops.yml'

permissions:
  contents: read
  pages: write

concurrency:
  group: authorized-platform-ops
  cancel-in-progress: false

jobs:
  operate:
    if: >-
      github.repository == 'ntoledo319/EOLkits' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.before == '23762f3f7a8e7ccc61b76c7fef4a00d1fa7fec99'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_BASE_SHA: 23762f3f7a8e7ccc61b76c7fef4a00d1fa7fec99
      DEV_KEY_1: ${{ secrets.DEV_API_KEY }}
      DEV_KEY_2: ${{ secrets.DEVTO_API_KEY }}
      DEV_KEY_3: ${{ secrets.DEV_TO_API_KEY }}
      DEV_KEY_4: ${{ secrets.FOREM_API_KEY }}
      ADMIN_KEY_1: ${{ secrets.REPO_ADMIN_TOKEN }}
      ADMIN_KEY_2: ${{ secrets.GH_ADMIN_TOKEN }}
      ADMIN_KEY_3: ${{ secrets.GITHUB_ADMIN_TOKEN }}
      ADMIN_KEY_4: ${{ secrets.GITHUB_PAT }}
      ADMIN_KEY_5: ${{ secrets.GH_PAT }}
      ADMIN_KEY_6: ${{ secrets.ADMIN_PAT }}
      ADMIN_KEY_7: ${{ secrets.PAT }}
      WORK_DIR: ${{ github.workspace }}/tmp/authorized-platform-ops
    steps:
      - name: Reconfirm the exact one-use authorization
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == 'push' ]]
          [[ "$GITHUB_REPOSITORY" == 'ntoledo319/EOLkits' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
          [[ "$EVENT_BEFORE" == "$EXPECTED_BASE_SHA" ]]
          mkdir -p "$WORK_DIR"

      - name: Unpublish the quarantined DEV corpus when an owner key exists
        id: dev
        shell: bash
        run: |
          set -euo pipefail
          dev_key=''
          for candidate in "$DEV_KEY_1" "$DEV_KEY_2" "$DEV_KEY_3" "$DEV_KEY_4"; do
            if [[ -z "$candidate" ]]; then
              continue
            fi
            identity_code="$(curl --silent --show-error --output "$WORK_DIR/dev-identity.json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.forem.api-v1+json' \
              --header "api-key: $candidate" \
              https://dev.to/api/users/me)"
            if [[ "$identity_code" == '200' ]] &&
              jq -e '.username == "ntoledo319"' "$WORK_DIR/dev-identity.json" >/dev/null; then
              dev_key="$candidate"
              break
            fi
          done

          if [[ -z "$dev_key" ]]; then
            echo 'state=no_valid_owner_key' >> "$GITHUB_OUTPUT"
            echo '- DEV cleanup: no recognized API-key secret authenticated as the article owner.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          article_ids=(
            4415397 4358088 4299552 4285700 4278244
            4269237 4260000 4251329 4242025 4242019
            4235344 4229110 4221233 4221225 4203214
            4193991 4185065 4185055 4147686 4130624
            4077457 4018182 3967998 3964987 3964978
          )
          for article_id in "${article_ids[@]}"; do
            update_code="$(curl --silent --show-error \
              --output "$WORK_DIR/dev-$article_id.json" \
              --write-out '%{http_code}' \
              --request PUT \
              --header 'Accept: application/vnd.forem.api-v1+json' \
              --header 'Content-Type: application/json' \
              --header "api-key: $dev_key" \
              --data '{"article":{"published":false}}' \
              "https://dev.to/api/articles/$article_id")"
            [[ "$update_code" == '200' ]]
            jq -e --argjson id "$article_id" \
              '.id == $id and .published == false and .user.username == "ntoledo319"' \
              "$WORK_DIR/dev-$article_id.json" >/dev/null
            sleep 1
          done

          sleep 5
          public_count="$(curl --silent --show-error --fail \
            'https://dev.to/api/articles?username=ntoledo319&per_page=100&page=1' | jq 'length')"
          [[ "$public_count" == '0' ]]
          echo 'state=unpublished_25_verified' >> "$GITHUB_OUTPUT"
          echo '- DEV cleanup: all 25 exact owner articles were reverted to drafts and the public author feed is empty.' >> "$GITHUB_STEP_SUMMARY"

      - name: Select and validate a repository administration token
        id: admin
        shell: bash
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          admin_key=''
          source=''
          candidates=(
            "$ADMIN_KEY_1" "$ADMIN_KEY_2" "$ADMIN_KEY_3" "$ADMIN_KEY_4"
            "$ADMIN_KEY_5" "$ADMIN_KEY_6" "$ADMIN_KEY_7" "$WORKFLOW_TOKEN"
          )
          for candidate in "${candidates[@]}"; do
            if [[ -z "$candidate" ]]; then
              continue
            fi
            repo_code="$(curl --silent --show-error --output "$WORK_DIR/repository.json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header "Authorization: Bearer $candidate" \
              https://api.github.com/repos/ntoledo319/EOLkits)"
            if [[ "$repo_code" == '200' ]] &&
              jq -e '.full_name == "ntoledo319/EOLkits"' "$WORK_DIR/repository.json" >/dev/null; then
              admin_key="$candidate"
              if [[ "$candidate" == "$WORKFLOW_TOKEN" ]]; then
                source='workflow_token'
              else
                source='configured_admin_candidate'
              fi
              break
            fi
          done
          [[ -n "$admin_key" ]]
          printf '%s' "$admin_key" > "$WORK_DIR/admin-token"
          chmod 0600 "$WORK_DIR/admin-token"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "- Repository administration candidate: $source (value never printed)." >> "$GITHUB_STEP_SUMMARY"

      - name: Switch Pages to the reviewed Actions deployment
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          admin_key="$(<"$WORK_DIR/admin-token")"
          pages_code="$(curl --silent --show-error --output "$WORK_DIR/pages-before.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header "Authorization: Bearer $admin_key" \
            https://api.github.com/repos/ntoledo319/EOLkits/pages)"
          if [[ "$pages_code" != '200' ]]; then
            echo "state=read_unavailable_http_$pages_code" >> "$GITHUB_OUTPUT"
            echo "- Pages source: read unavailable (HTTP $pages_code); no mutation attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if jq -e '.build_type == "workflow"' "$WORK_DIR/pages-before.json" >/dev/null; then
            echo 'state=already_workflow' >> "$GITHUB_OUTPUT"
            echo '- Pages source: already GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          update_code="$(curl --silent --show-error --output "$WORK_DIR/pages-update.json" \
            --write-out '%{http_code}' \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $admin_key" \
            --data '{"build_type":"workflow"}' \
            https://api.github.com/repos/ntoledo319/EOLkits/pages)"
          if [[ "$update_code" != '204' ]]; then
            echo "state=update_unavailable_http_$update_code" >> "$GITHUB_OUTPUT"
            echo "- Pages source: update unavailable (HTTP $update_code); setting was not changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          curl --silent --show-error --fail \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header "Authorization: Bearer $admin_key" \
            https://api.github.com/repos/ntoledo319/EOLkits/pages \
            > "$WORK_DIR/pages-after.json"
          jq -e '.build_type == "workflow"' "$WORK_DIR/pages-after.json" >/dev/null
          echo 'state=changed_to_workflow_verified' >> "$GITHUB_OUTPUT"
          echo '- Pages source: changed to GitHub Actions and read-after-write verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Protect main and v2 from deletion and force pushes
        id: ruleset
        shell: bash
        run: |
          set -euo pipefail
          admin_key="$(<"$WORK_DIR/admin-token")"
          list_code="$(curl --silent --show-error --output "$WORK_DIR/rulesets-before.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header "Authorization: Bearer $admin_key" \
            https://api.github.com/repos/ntoledo319/EOLkits/rulesets)"
          if [[ "$list_code" != '200' ]]; then
            echo "state=read_unavailable_http_$list_code" >> "$GITHUB_OUTPUT"
            echo "- Branch ruleset: read unavailable (HTTP $list_code); no mutation attempted." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if jq -e 'any(.[]; .name == "Protect main and v2 refs" and .enforcement == "active")' \
            "$WORK_DIR/rulesets-before.json" >/dev/null; then
            echo 'state=already_active' >> "$GITHUB_OUTPUT"
            echo '- Branch ruleset: the exact active ruleset already exists.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$(jq 'length' "$WORK_DIR/rulesets-before.json")" != '0' ]]; then
            echo 'state=other_ruleset_present_no_mutation' >> "$GITHUB_OUTPUT"
            echo '- Branch ruleset: another ruleset exists; no duplicate or destructive edit was attempted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -n '{
            name: "Protect main and v2 refs",
            target: "branch",
            enforcement: "active",
            conditions: {ref_name: {include: ["~DEFAULT_BRANCH", "refs/heads/v2"], exclude: []}},
            rules: [{type: "deletion"}, {type: "non_fast_forward"}]
          }' > "$WORK_DIR/ruleset-create.json"
          create_code="$(curl --silent --show-error --output "$WORK_DIR/ruleset-after.json" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $admin_key" \
            --data-binary @"$WORK_DIR/ruleset-create.json" \
            https://api.github.com/repos/ntoledo319/EOLkits/rulesets)"
          if [[ "$create_code" != '201' ]]; then
            echo "state=create_unavailable_http_$create_code" >> "$GITHUB_OUTPUT"
            echo "- Branch ruleset: create unavailable (HTTP $create_code); no rule was installed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -e '
            .name == "Protect main and v2 refs" and .enforcement == "active" and
            (.conditions.ref_name.include | sort) == (["~DEFAULT_BRANCH", "refs/heads/v2"] | sort) and
            ([.rules[].type] | sort) == (["deletion", "non_fast_forward"] | sort)
          ' "$WORK_DIR/ruleset-after.json" >/dev/null
          echo 'state=created_verified' >> "$GITHUB_OUTPUT"
          echo '- Branch ruleset: active deletion/non-fast-forward protection created for main and v2.' >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy transient response and token files
        if: always()
        shell: bash
        run: |
          find "$WORK_DIR" -type f -exec shred -u {} + 2>/dev/null || true
          rmdir "$WORK_DIR" 2>/dev/null || true
