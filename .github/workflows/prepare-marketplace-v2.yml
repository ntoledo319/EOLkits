name: Prepare Marketplace v2 draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-marketplace-v2.yml'
      - '.github/release-notes/marketplace-v2.md'
      - '.github/ISSUE_TEMPLATE/audit-interest.yml'
      - 'README.md'
      - 'action.yml'
      - 'apps/github-action/**'
      - 'kits/**'
      - 'rules/public/**'

permissions:
  contents: write

concurrency:
  group: prepare-marketplace-v2
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate the release surface
        shell: bash
        run: |
          set -euo pipefail
          test -f action.yml
          test -f apps/github-action/run.sh
          grep -Fq 'uses: ntoledo319/EOLkits@v2' README.md
          grep -Fq 'The only paid product EOLkits is prepared to offer' README.md
          grep -Fq 'https://ntoledo319.github.io/EOLkits/audit/' README.md
          grep -Fq 'audit-interest.yml' apps/github-action/run.sh
          grep -Fq 'one-repository evidence report (\$299)' apps/github-action/run.sh
          if grep -Eiq 'surge to|Migration Pack.*\$|Org License.*\$|Drift Watch.*\$' README.md; then
            echo "::error::Retired commercial claim found in the release README"
            exit 1
          fi
          if grep -REiq 'https://eolkits\.com/(audit|scan|eol-checker|migrate)' \
            README.md apps/github-action apps/vscode-extension kits; then
            echo "::error::Release copy points at the obsolete custom-domain funnel"
            exit 1
          fi

      - name: Create or synchronize the private release draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == "v2.0.0") | {id: .id, draft: .draft}' \
            | head -n 1)"
          if [[ -n "$release_json" ]]; then
            release_id="$(jq -er '.id' <<<"$release_json")"
            if [[ "$(jq -r '.draft' <<<"$release_json")" != true ]]; then
              echo "::error::v2.0.0 is already public; refusing to rewrite a release"
              exit 1
            fi
            jq -n \
              --arg target "$GITHUB_SHA" \
              --rawfile body .github/release-notes/marketplace-v2.md \
              '{target_commitish: $target, name: "Rupture AWS Deprecation Check v2.0.0", body: $body, draft: true, prerelease: false}' \
              | gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/releases/$release_id" --input - >/dev/null
            echo "Synchronized private v2.0.0 draft to commit $GITHUB_SHA."
            exit 0
          fi
          gh release create v2.0.0 \
            --draft \
            --target "$GITHUB_SHA" \
            --title 'Rupture AWS Deprecation Check v2.0.0' \
            --notes-file .github/release-notes/marketplace-v2.md
          echo "Created private v2.0.0 draft at commit $GITHUB_SHA."
