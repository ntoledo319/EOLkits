name: Publish VS Code Extension

on:
  # One-use owner-attributed trigger for the v1.3 correctness release. Remove
  # this trigger immediately after the publication run reaches a terminal state.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vscode.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH_RUPTURE_VSCODE_1_3_0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rupture-vscode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'ntoledo319/EOLkits' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.confirm == 'PUBLISH_RUPTURE_VSCODE_1_3_0') ||
       (github.event_name == 'push' &&
        github.event.before == '44e0425f3b94b085835c85a2e0dbf28642914973'))
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: 44e0425f3b94b085835c85a2e0dbf28642914973
      TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
    steps:
      - name: Reconfirm the publication authorization
        shell: bash
        env:
          PUBLICATION_CONFIRMATION: ${{ inputs.confirm }}
          EVENT_BEFORE: ${{ github.event.before }}
          ONE_SHOT_BASE_SHA: 44e0425f3b94b085835c85a2e0dbf28642914973
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'ntoledo319/EOLkits' ||
                "$GITHUB_REF" != 'refs/heads/main' ||
                "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ||
                "$GITHUB_TRIGGERING_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo '::error::Exact repository-owner authorization on ntoledo319/EOLkits main is required'
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [[ "$PUBLICATION_CONFIRMATION" == 'PUBLISH_RUPTURE_VSCODE_1_3_0' ]]
              ;;
            push)
              [[ "$EVENT_BEFORE" == "$ONE_SHOT_BASE_SHA" ]]
              ;;
            *)
              echo "::error::Unsupported publication event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: mkdir -p "$TMPDIR" "$npm_config_cache" && npm ci
        working-directory: apps/vscode-extension

      - name: Test extension
        run: npm test
        working-directory: apps/vscode-extension

      - name: Verify existing Marketplace identity
        run: |
          test "$(node -p 'require("./package.json").publisher + "." + require("./package.json").name')" = 'rupture.rupture-vscode'
          test "$(node -p 'require("./package.json").version')" = '1.3.0'
        working-directory: apps/vscode-extension

      - name: Package extension
        run: npm run package
        working-directory: apps/vscode-extension

      - name: Publish extension
        run: |
          mapfile -t VSIX_FILES < <(find . -maxdepth 1 -type f -name '*.vsix' -print)
          test "${#VSIX_FILES[@]}" -eq 1
          npx vsce publish --packagePath "${VSIX_FILES[0]}" -p "$VSCE_PAT"
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
