name: Publish VS Code Extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: mkdir -p "$TMPDIR" "$npm_config_cache" && npm ci
        working-directory: apps/vscode-extension

      - name: Test extension
        run: npm test
        working-directory: apps/vscode-extension

      - name: Package extension
        run: npm run package
        working-directory: apps/vscode-extension

      - name: Publish extension
        run: |
          VSIX="$(find . -maxdepth 1 -type f -name 'eolkits-vscode-*.vsix' -print -quit)"
          test -n "$VSIX"
          npx vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
