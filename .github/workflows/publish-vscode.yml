name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH_RUPTURE_VSCODE_1_3_1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rupture-vscode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'ntoledo319/EOLkits' &&
      github.ref == 'refs/heads/fix/vscode-canonical-links-20260930' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirm == 'PUBLISH_RUPTURE_VSCODE_1_3_1'
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: b46211fed4e06c77c6ed593899b1dc8f9b82f108
      TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
    steps:
      - name: Reconfirm the publication authorization
        shell: bash
        env:
          PUBLICATION_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'ntoledo319/EOLkits' ||
                "$GITHUB_REF" != 'refs/heads/fix/vscode-canonical-links-20260930' ||
                "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ||
                "$GITHUB_TRIGGERING_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ||
                "$PUBLICATION_CONFIRMATION" != 'PUBLISH_RUPTURE_VSCODE_1_3_1' ]]; then
            echo '::error::Exact repository-owner authorization on ntoledo319/EOLkits release branch is required'
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'

      - name: Install dependencies
        run: mkdir -p "$TMPDIR" "$npm_config_cache" && npm ci --no-audit
        working-directory: apps/vscode-extension

      - name: Test extension
        run: npm test
        working-directory: apps/vscode-extension

      - name: Verify existing Marketplace identity
        run: |
          test "$(node -p 'require("./package.json").publisher + "." + require("./package.json").name')" = 'rupture.rupture-vscode'
          test "$(node -p 'require("./package.json").version')" = '1.3.1'
        working-directory: apps/vscode-extension

      - name: Package extension
        run: npm run package
        working-directory: apps/vscode-extension

      - name: Publish extension
        run: |
          mapfile -t VSIX_FILES < <(find . -maxdepth 1 -type f -name '*.vsix' -print)
          test "${#VSIX_FILES[@]}" -eq 1
          npx vsce publish --packagePath "${VSIX_FILES[0]}" -p "$VSCE_PAT"
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
