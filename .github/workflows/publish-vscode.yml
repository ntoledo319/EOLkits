name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH_RUPTURE_VSCODE_1_1_0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rupture-vscode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'ntoledo319/EOLkits' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      inputs.confirm == 'PUBLISH_RUPTURE_VSCODE_1_1_0'
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: a9cdcaeb40637d1f58f7539e80a16ec569be6704
      TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
      npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
    steps:
      - name: Reconfirm the publication authorization
        shell: bash
        env:
          PUBLICATION_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'ntoledo319/EOLkits' ||
                "$GITHUB_REF" != 'refs/heads/main' ||
                "$GITHUB_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ||
                "$GITHUB_TRIGGERING_ACTOR" != "$GITHUB_REPOSITORY_OWNER" ||
                "$PUBLICATION_CONFIRMATION" != 'PUBLISH_RUPTURE_VSCODE_1_1_0' ]]; then
            echo '::error::Exact repository-owner authorization on ntoledo319/EOLkits main is required'
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false

      - name: Verify exact release commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: mkdir -p "$TMPDIR" "$npm_config_cache" && npm ci
        working-directory: apps/vscode-extension

      - name: Test extension
        run: npm test
        working-directory: apps/vscode-extension

      - name: Verify existing Marketplace identity
        run: |
          test "$(node -p \"require('./package.json').publisher + '.' + require('./package.json').name\")" = 'rupture.rupture-vscode'
          test "$(node -p \"require('./package.json').version\")" = '1.1.0'
        working-directory: apps/vscode-extension

      - name: Package extension
        run: npm run package
        working-directory: apps/vscode-extension

      - name: Publish extension
        run: |
          mapfile -t VSIX_FILES < <(find . -maxdepth 1 -type f -name '*.vsix' -print)
          test "${#VSIX_FILES[@]}" -eq 1
          npx vsce publish --packagePath "${VSIX_FILES[0]}" -p "$VSCE_PAT"
        working-directory: apps/vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
