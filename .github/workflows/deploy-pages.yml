name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/web/**'
      - 'apps/runner/audit_pdf.py'
      - 'apps/runner/build_sample_report.py'
      - 'apps/runner/requirements.lock'
      - 'pricing.yml'
      - 'rules/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/tmp/pip-cache
      EOLKITS_BASE_PATH: /EOLkits
      EOLKITS_SITE_URL: https://ntoledo319.github.io/EOLkits
      EOLKITS_API_URL: https://eolkits.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the committed static output
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/sample-venv"
          "$GITHUB_WORKSPACE/tmp/sample-venv/bin/pip" install --require-hashes -r apps/runner/requirements.lock
          "$GITHUB_WORKSPACE/tmp/sample-venv/bin/python" apps/runner/build_sample_report.py --check
          python -m venv "$GITHUB_WORKSPACE/tmp/web-venv"
          "$GITHUB_WORKSPACE/tmp/web-venv/bin/pip" install --require-hashes -r apps/web/requirements-dev.lock
          "$GITHUB_WORKSPACE/tmp/web-venv/bin/python" apps/web/build.py
          "$GITHUB_WORKSPACE/tmp/web-venv/bin/pytest" -q apps/web
          git diff --exit-code -- docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
