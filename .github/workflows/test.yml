name: Test release surfaces

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
  PIP_CACHE_DIR: ${{ github.workspace }}/tmp/pip-cache
  npm_config_cache: ${{ github.workspace }}/tmp/npm-cache

jobs:
  python-kits:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kit: [al2023-gate, python-pivot]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test kit
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/${{ matrix.kit }}-venv"
          venv="$GITHUB_WORKSPACE/tmp/${{ matrix.kit }}-venv"
          "$venv/bin/pip" install -e "kits/${{ matrix.kit }}[dev]"
          "$venv/bin/pytest" -q --cov="kits/${{ matrix.kit }}/src" \
            --cov-report="xml:$GITHUB_WORKSPACE/tmp/${{ matrix.kit }}-coverage.xml" \
            "kits/${{ matrix.kit }}/test"
      - uses: codecov/codecov-action@v6
        with:
          files: ./tmp/${{ matrix.kit }}-coverage.xml
          flags: ${{ matrix.kit }}

  node-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - run: npm ci && npm test
        working-directory: kits/lambda-lifeline

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - run: npm ci && npm run build && npm test
        working-directory: apps/worker

  grace-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test API
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/grace-venv"
          venv="$GITHUB_WORKSPACE/tmp/grace-venv"
          "$venv/bin/pip" install -r apps/grace-api/requirements-dev.txt
          "$venv/bin/pytest" -q apps/grace-api

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test report runner
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/runner-venv"
          venv="$GITHUB_WORKSPACE/tmp/runner-venv"
          "$venv/bin/pip" install -r apps/runner/requirements-dev.txt
          "$venv/bin/pytest" -q apps/runner

  web:
    runs-on: ubuntu-latest
    env:
      EOLKITS_BASE_PATH: /EOLkits
      EOLKITS_SITE_URL: https://ntoledo319.github.io/EOLkits
      EOLKITS_API_URL: https://eolkits.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build and test generated site
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/web-venv"
          venv="$GITHUB_WORKSPACE/tmp/web-venv"
          "$venv/bin/pip" install -r apps/web/requirements-dev.txt
          "$venv/bin/python" apps/web/build.py
          "$venv/bin/pytest" -q apps/web
          git diff --exit-code -- docs
      - name: Reject stale or unrendered commerce output
        run: |
          set -euo pipefail
          if grep -REn '\{API_URL\}|\{\{|\}\}' \
            docs/audit/index.html docs/pack/index.html docs/license/index.html docs/partners/index.html; then
            echo "::error::Unrendered placeholder found"; exit 1
          fi
          if grep -REn 'eolkits-worker|/Rupture/' docs; then
            echo "::error::Stale deployment URL found"; exit 1
          fi
          if grep -RPn 'https://ntoledo319\.github\.io/(?!EOLkits(?:/|["<]))' docs; then
            echo "::error::Unprefixed GitHub Pages URL found"; exit 1
          fi
          if grep -En '<loc>https?://' docs/sitemap.xml | \
            grep -v 'https://ntoledo319\.github\.io/EOLkits/'; then
            echo "::error::Noncanonical host in sitemap"; exit 1
          fi

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: mkdir -p "$TMPDIR" "$npm_config_cache"
      - run: npm ci && npm test && npm run package
        working-directory: apps/vscode-extension

  github-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Exercise clean and findings fixtures
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR" "$npm_config_cache" "$GITHUB_WORKSPACE/tmp"
          clean_output="$GITHUB_WORKSPACE/tmp/action-clean-output"
          findings_output="$GITHUB_WORKSPACE/tmp/action-findings-output"
          : > "$clean_output"
          : > "$findings_output"
          GITHUB_ACTION_PATH="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$clean_output" \
            INPUT_KIT=lambda-lifeline INPUT_PATH=apps/github-action/test/fixtures/clean \
            INPUT_FAIL_ON=any bash apps/github-action/run.sh
          grep -qx 'has_findings=false' "$clean_output"
          grep -qx 'should_fail=false' "$clean_output"
          clean_report="$(sed -n 's/^report_path=//p' "$clean_output")"
          test -f "$clean_report"
          if grep -Fq 'audit-interest.yml' "$clean_report"; then
            echo "::error::Clean scan must not request qualified finding-based interest"
            exit 1
          fi
          GITHUB_ACTION_PATH="$GITHUB_WORKSPACE" GITHUB_OUTPUT="$findings_output" \
            INPUT_KIT=lambda-lifeline INPUT_PATH=apps/github-action/test/fixtures/findings \
            INPUT_FAIL_ON=any bash apps/github-action/run.sh
          grep -qx 'has_findings=true' "$findings_output"
          grep -qx 'should_fail=true' "$findings_output"
          findings_report="$(sed -n 's/^report_path=//p' "$findings_output")"
          test -f "$findings_report"
          grep -Fq 'https://ntoledo319.github.io/EOLkits/audit/' "$findings_report"
          grep -Fq 'one-repository evidence report ($299)' "$findings_report"
          grep -Fq 'audit-interest.yml' "$findings_report"
          if grep -Fq 'https://eolkits.com/audit' "$findings_report"; then
            echo "::error::Action report points at the obsolete custom-domain funnel"
            exit 1
          fi

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [apps/grace-api/Dockerfile, apps/runner/Dockerfile]
    steps:
      - uses: actions/checkout@v6
      - name: Build ${{ matrix.dockerfile }}
        run: docker build --file "${{ matrix.dockerfile }}" .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Audit locked Python graphs and Node runtime licenses
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/audit-venv"
          venv="$GITHUB_WORKSPACE/tmp/audit-venv"
          "$venv/bin/pip" install 'pip-audit>=2.10,<3'
          "$venv/bin/pip-audit" -r apps/grace-api/requirements.lock --progress-spinner off
          "$venv/bin/pip-audit" -r apps/runner/requirements.lock --progress-spinner off
          node scripts/audit-node-locks.mjs \
            kits/lambda-lifeline/package-lock.json \
            apps/worker/package-lock.json \
            apps/vscode-extension/package-lock.json
          npm audit --omit=dev --audit-level=high --prefix kits/lambda-lifeline
          npm audit --omit=dev --audit-level=high --prefix apps/worker

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Lint, format-check, and type-check Python
        run: |
          mkdir -p "$TMPDIR" "$PIP_CACHE_DIR"
          python -m venv "$GITHUB_WORKSPACE/tmp/lint-venv"
          venv="$GITHUB_WORKSPACE/tmp/lint-venv"
          "$venv/bin/pip" install -r requirements-lint.txt
          "$venv/bin/ruff" check kits/ apps/grace-api apps/runner apps/web
          "$venv/bin/black" --check kits/ apps/grace-api apps/runner apps/web
          "$venv/bin/mypy" kits/al2023-gate/src kits/python-pivot/src --ignore-missing-imports
          if grep -REn 'https://eolkits\.com/(audit|scan|eol-checker|migrate)' \
            README.md apps/github-action apps/vscode-extension kits; then
            echo "::error::Distribution copy points at the obsolete custom-domain funnel"
            exit 1
          fi
