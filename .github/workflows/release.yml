name: Release one tested kit

on:
  push:
    tags:
      - 'al2023-gate-v*.*.*'
      - 'python-pivot-v*.*.*'
      - 'lambda-lifeline-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve and validate tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            al2023-gate-v*) kit=al2023-gate ;;
            python-pivot-v*) kit=python-pivot ;;
            lambda-lifeline-v*) kit=lambda-lifeline ;;
            *) echo "::error::Unsupported release tag: $tag"; exit 1 ;;
          esac
          version="${tag#${kit}-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Tag version must be strict SemVer: $tag"; exit 1;
          }
          if [[ "$kit" = lambda-lifeline ]]; then
            manifest_version="$(node -p "require('./kits/$kit/package.json').version")"
          else
            manifest_version="$(python - "$kit" <<'PY'
          import sys, tomllib
          from pathlib import Path
          print(tomllib.loads(Path('kits', sys.argv[1], 'pyproject.toml').read_text())['project']['version'])
          PY
          )"
          fi
          [[ "$version" = "$manifest_version" ]] || {
            echo "::error::Tag version $version does not match $kit manifest $manifest_version"; exit 1;
          }
          {
            echo "kit=$kit"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create project-local Python environment
        if: steps.release.outputs.kit != 'lambda-lifeline'
        run: |
          python -m venv "$GITHUB_WORKSPACE/tmp/release-venv"
          "$GITHUB_WORKSPACE/tmp/release-venv/bin/pip" install \
            -e "kits/${{ steps.release.outputs.kit }}[dev]" \
            'build>=1.2,<2'

      - name: Test and build Python kit
        if: steps.release.outputs.kit != 'lambda-lifeline'
        env:
          TMPDIR: ${{ github.workspace }}/tmp/runtime-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$GITHUB_WORKSPACE/dist"
          venv="$GITHUB_WORKSPACE/tmp/release-venv"
          "$venv/bin/pytest" -q "kits/${{ steps.release.outputs.kit }}/test"
          "$venv/bin/python" -m build \
            "kits/${{ steps.release.outputs.kit }}" \
            --outdir "$GITHUB_WORKSPACE/dist"

      - name: Test and build Node kit
        if: steps.release.outputs.kit == 'lambda-lifeline'
        working-directory: kits/lambda-lifeline
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm test
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --pack-destination "$GITHUB_WORKSPACE/dist"

      - name: Generate and verify checksums
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "$GITHUB_WORKSPACE"/dist/* \
            --verify-tag \
            --generate-notes \
            --title "${{ steps.release.outputs.kit }} v${{ steps.release.outputs.version }}"
