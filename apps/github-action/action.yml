# Subpath copy of the root action.yml. The repo-root action.yml is the
# canonical Marketplace listing (uses: ntoledo319/EOLkits@v2). This copy keeps
# `uses: ntoledo319/EOLkits/apps/github-action@v2` working and MUST have a
# distinct `name:` — GitHub Marketplace requires globally-unique action names,
# and a duplicate name in the same repo blocks the listing from publishing.
name: "EOLkits AWS Deprecation Check (subpath)"
description: "Check source and IaC for AWS runtime deprecation risks before they hit production"
author: "EOLkits"
branding:
  icon: "alert-triangle"
  color: "orange"

inputs:
  kit:
    description: "Which kit to run: auto, all, lambda-lifeline, al2023-gate, or python-pivot"
    required: false
    default: "auto"
  path:
    description: "Repository path to scan"
    required: false
    default: "."
  fail-on:
    description: "Failure mode: any (fail on any finding) or none (report findings only). Tool/configuration errors always fail."
    required: false
    default: "any"
  comment-pr:
    description: "Post a PR comment with the scan summary"
    required: false
    default: "false"

outputs:
  report_path:
    description: "Absolute path to the generated Markdown report"
    value: ${{ steps.scan.outputs.report_path }}
  should_fail:
    description: "true when configured findings or a tool/configuration error should fail the check"
    value: ${{ steps.scan.outputs.should_fail }}
  has_findings:
    description: "true when one or more configured checks found a migration risk"
    value: ${{ steps.scan.outputs.has_findings }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Run EOLkits check
      id: scan
      shell: bash
      env:
        INPUT_KIT: ${{ inputs.kit }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        bash "$GITHUB_ACTION_PATH/run.sh"

    - name: Comment PR
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require("fs");
          const reportPath = "${{ steps.scan.outputs.report_path }}";
          const body = fs.readFileSync(reportPath, "utf8");

          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body
          });

    - name: Enforce result
      if: steps.scan.outputs.should_fail == 'true'
      shell: bash
      run: |
        echo "::error::EOLkits found risks or could not complete a configured check."
        exit 1
