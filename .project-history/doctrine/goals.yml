# Fields: id, version, statement, status (proposed | active | measured | narrowed | expanded |
# blocked | achieved | abandoned | superseded), proposed (date), supersedes (id or null),
# claim_ids, definition_of_success (as stated at the time), review_by (date the audit should
# re-check, or null), outcome (what the evidence shows), notes. A goal's definition of success
# is never edited after the fact; a changed definition is a new goal that supersedes the old one.
