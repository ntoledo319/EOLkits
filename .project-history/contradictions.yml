# Contradiction register for the EOLkits (formerly Rupture) history. Reconstructed 2026-09-04.
#
# Each entry preserves competing accounts rather than resolving them by fiat. Fields: id,
# disputed_claim, accounts (label, account, source_ids, claim_ids, date, proximity to the event,
# independence/strength), disagreement_kind (fact | chronology | interpretation | motive | credit |
# outcome), best_supported_reading, confidence, resolving_evidence, status (open | resolved).
# "Resolved" means the record now carries an evidenced reading, not that the sources agree.
contradictions:
  - id: CON-001
    disputed_claim: "The 2026-04-29 runbook's autonomy rule ('if a step needs a human, it does not exist') described how the launch actually worked."
    disagreement_kind: interpretation
    accounts:
      - label: stated-rule
        account: "updateplan.md made full autonomy a non-negotiable: every SKU terminates in a webhook, not a human."
        source_ids: [SRC-repo-git, SRC-repo-deleted-docs]
        claim_ids: [CLM-E1-017]
        date: 2026-04-29
        proximity: contemporaneous
        strength: direct statement, agent-drafted
      - label: launch-gates
        account: "Every launch gate in the same era was operator-only: three blocking credentials, Marketplace toggle, Show HN, GitHub App secrets; readiness.md admitted the App credentials were the only true blockers."
        source_ids: [SRC-repo-git, SRC-repo-deleted-docs]
        claim_ids: [CLM-E1-028, CLM-E1-043, CLM-E1-044]
        date: 2026-05-02
        proximity: contemporaneous
        strength: direct, corroborated by the July human-queue pattern (CLM-E3-057)
    best_supported_reading: "The rule governed fulfilment design (webhooks, refunds, bots) but never the launch path; owner clicks were the binding constraint in every era, which the July operating doc later formalised as a bounded Human Queue rather than denying."
    confidence: strongly_supported
    resolving_evidence: "Nothing further is needed; the tension is structural and recurs in CLM-E3-057, CLM-E4A-052 and CLM-E4B-060."
    status: resolved
