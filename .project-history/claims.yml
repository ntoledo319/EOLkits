# Claim ledger for the EOLkits (formerly Rupture) history. Reconstructed 2026-09-04.
#
# One entry per material historical claim. Fields: claim_id (stable; CLM-<era>-nnn where the era
# prefix records which reconstruction slice produced it: E1 2026-04-28..05-15, E2 05-16..06-30,
# E3 07-01..08-14, E4A 08-15..08-29, E4B 08-30..09-04, EXT = evidence outside the repository),
# claim, date or date_range, source_ids (see sources.yml), locator (full 40-hex commit SHA plus
# path@sha, PR number, release tag, or an absolute local path for owner records), evidence_type
# (direct | contemporaneous | retrospective | behavioral | inferred), status (verified | reported |
# inferred | disputed | unknown), confidence (confirmed | strongly_supported | plausible |
# speculative | unknown), rationale, caveats, and an optional see_also list.
#
# Deduplication policy: repeated or cherry-picked work is counted once. The 2026-08-22..08-25
# "Nick Toledo"/"ntoledo319" mirror pairs (identical trees published through the GitHub object
# API) and the 2026-08-30..09-04 local/remote PR-head pairs are cited by one anchor each and
# described in CLM-E4A-022 and CLM-E4B-028; they are not separate claims. Where two slices
# describe the same commit from different vantage points the entries are kept (they carry
# different rationale and caveats) and cross-linked with see_also rather than merged, so that
# no claim silently changes meaning. Dates are author dates unless the claim says otherwise.
# Secrets policy: identifiers, keys, tokens, hostnames of private services and third-party
# personal data are not reproduced; where a commit touched such material the claim says so.
